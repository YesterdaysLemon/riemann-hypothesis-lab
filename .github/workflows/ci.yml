name: certificate-gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: rh-lab verify-claims
      - run: rh-lab verify-zeros --artifact results/zeros-1-10000.json --bits 384
      - run: rh-lab verify-lagarias --artifact results/lagarias-1-1000000.json
      - run: rh-lab verify-weil --artifact results/weil-matrix-c5-over-2-n4.json --bits 384
      - run: rh-lab verify-weil-search --index results/weil-search-grid-v1/index.json --checkpoint-dir results/weil-search-grid-v1
