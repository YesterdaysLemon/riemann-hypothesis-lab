[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "riemann-hypothesis-lab"
version = "0.1.0"
description = "Certificate-first, reproducible research toward proving or disproving the Riemann Hypothesis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Alireza Afshan" },
]
dependencies = [
  "python-flint==0.9.0",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.0,<7",
  "pytest>=8.3,<9",
]

[project.scripts]
rh-lab = "riemann_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "slow: certificate jobs intentionally omitted from the default test run",
]
